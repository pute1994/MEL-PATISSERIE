<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b1a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gestion Mel Pâtisserie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: chaleureux et net, un outil de travail de tous les jours
   IDEA: le carnet de commandes d'une pâtisserie
   PICTURE: le bénéfice du mois en grand, la balance ventes / dépenses, une pièce montée
   COLOUR and TYPE: chocolat, fraise, caramel ; Nunito
   LAYOUT: une colonne de 760px, onglets en bas, formulaires en feuille */
:root{color-scheme:light dark;--bg:light-dark(#fefaf1,#1c100c);--card:light-dark(#fff,#2a1913);--ink:light-dark(#3a1a12,#f7ece2);--mute:light-dark(#7f6a5e,#bba697);--line:light-dark(#efe2d2,#3d2a1f);--choc:#5b1a12;--cream:#fefaf1;--fr:light-dark(#9a2c1b,#f2967a);--frs:light-dark(#f7ece0,#3a1c14);--ca:light-dark(#b07a1e,#e2b65c);--cas:light-dark(#f9efda,#3b2c14);--ok:light-dark(#1f8a5b,#5fd39b);--oks:light-dark(#e1f4ea,#173528);--bad:light-dark(#c0392b,#ff8a7a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fr);outline-offset:2px}
header{background:var(--choc);color:var(--cream)}
.hd{max-width:760px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:14px;background:var(--cream);flex:none;object-fit:contain;padding:2px;box-shadow:0 0 0 2px #c8932f66}
.brand{flex:1}.brand b{display:block;font-size:18px;font-weight:900;line-height:1.1}.brand span{font-size:13px;opacity:.75}
.mbar{display:flex;align-items:center;gap:4px;background:#ffffff1a;border-radius:999px;padding:3px}
.mbar b{min-width:128px;text-align:center;font-size:15px;text-transform:capitalize}
.mbar button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--cream);font-size:22px;line-height:1}
.mbar button:hover{background:#ffffff26}
.gear{width:44px;height:44px;border:0;border-radius:50%;background:#ffffff1a;color:var(--cream);display:grid;place-items:center;flex:none}.gear svg{width:22px;height:22px}
.connect{background:var(--cas);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.connect p{margin:0;max-width:440px}
.ok-msg{color:var(--ok);font-weight:800}
#status button{border:0;background:none;color:var(--fr);font-weight:800;text-decoration:underline;padding:4px}
#status{max-width:760px;margin:auto;padding:0 16px;font-size:13px;color:var(--mute)}#status:not(:empty){padding-top:8px}
main{max-width:760px;margin:auto;padding:16px}
h1{font-size:32px;line-height:1.05;margin:4px 0;font-weight:900}
h2{font-size:20px;margin:28px 0 10px;font-weight:900;display:flex;align-items:center;gap:8px}
.count{background:var(--fr);color:#fff;border-radius:999px;font-size:13px;padding:1px 9px}
.hero{position:relative;background:var(--frs);border-radius:24px;padding:22px 20px 18px;overflow:hidden}
.hero .hlogo{position:absolute;right:12px;top:10px;width:120px;height:120px;border-radius:20px;mix-blend-mode:multiply}
:root[data-theme=dark] .hero .hlogo{mix-blend-mode:normal;opacity:.95}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero .hlogo{mix-blend-mode:normal;opacity:.95}}
.hl{font-size:15px;font-weight:700;color:var(--mute)}.hl b{text-transform:capitalize;color:var(--ink)}
.big{font-size:clamp(38px,9vw,56px);font-weight:900;line-height:1.05;color:var(--ok);margin:6px 0 2px;white-space:nowrap;position:relative}
.big.neg,.neg{color:var(--bad)}
.sub{color:var(--mute);font-size:15px;max-width:60%}
.bal{margin-top:16px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.row b{white-space:nowrap;text-align:right}
.bar{height:12px;border-radius:99px;background:light-dark(#ffffffaa,#ffffff14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
i.v{background:var(--ok)}i.a{background:var(--ca)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.quick button,.add{border:0;border-radius:999px;background:var(--choc);color:var(--cream);font-weight:800;padding:0 16px;min-height:44px}
:root[data-theme=dark] .quick button,:root[data-theme=dark] .add{background:var(--cream);color:var(--choc)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .quick button,:root:not([data-theme=light]) .add{background:var(--cream);color:var(--choc)}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpis b{display:block;font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpis span{font-size:13px;color:var(--mute)}
.cmd{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ca);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.cmd.st-prep{border-left-color:var(--fr)}.cmd.st-prete{border-left-color:#7a5af5}.cmd.st-livree{border-left-color:var(--ok);opacity:.85}.cmd.st-annulee{border-left-color:var(--mute);opacity:.6}
.when{font-weight:900;font-size:15px;line-height:1.25;text-transform:capitalize}
.when .bad,.bad{color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top b{font-size:17px}
.pill{font-size:13px;font-weight:800;background:var(--cas);color:var(--ca);border-radius:999px;padding:2px 10px;white-space:nowrap}
.st-prep .pill{background:var(--frs);color:var(--fr)}.st-livree .pill{background:var(--oks);color:var(--ok)}
.prod{margin-top:2px}.mute{color:var(--mute)}
.meta{font-size:14px;color:var(--mute);margin-top:4px}.due{color:var(--fr);font-weight:800;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:0 14px;min-height:40px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.wa{background:#25d366;border-color:#25d366;color:#06301a}
.btn.cal{background:#e8f0fe;border-color:#c6d7fb;color:#1a4fb8}
.calbtns{display:grid;gap:10px;margin-top:14px}
.calb{display:grid;gap:2px;text-align:left;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:44px;font:inherit;width:100%}
.calb b{font-size:16px}.calb span{font-size:14px;color:var(--mute)}
.calb.g{border-left:5px solid #1a73e8}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--mute);margin:0}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px 10px}
.col{display:grid;justify-items:center;gap:4px;cursor:pointer;border-radius:10px;padding:4px 0}
.col.cur{background:var(--cas)}
.bars{height:120px;display:flex;align-items:flex-end;gap:4px}
.bars i{width:12px;border-radius:6px 6px 2px 2px;min-height:2px;transition:height .5s}
.col b{font-size:13px;color:var(--ok);white-space:nowrap}.col span{font-size:13px;color:var(--mute);text-transform:capitalize}
.legend{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;margin-bottom:8px}
.cat b{white-space:nowrap}.cat .bar{background:var(--line)}
.ghost{border:2px solid var(--choc);background:transparent;border-radius:999px;min-height:44px;padding:0 18px;font-weight:800;margin-top:24px}
:root[data-theme=dark] .ghost{border-color:var(--cream)}
.note{font-size:13px;color:var(--mute)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 16px;font-weight:800}
.chip.on{background:var(--fr);border-color:var(--fr);color:#fff}
.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;font-size:16px;margin-bottom:14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.tot span{color:var(--mute)}.tot b{font-size:28px;font-weight:900;white-space:nowrap}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.item:first-child{border-top:0}.item:hover{background:var(--bg)}
.item span{display:block;font-size:14px;color:var(--mute)}.amt{white-space:nowrap}
.art{cursor:default;align-items:flex-start}.art span+span{margin-top:2px}
.ar{display:grid;justify-items:end;gap:6px;text-align:right;flex:none}.ar span{font-size:13px;color:var(--mute)}
#hint{margin:-4px 0 0;color:var(--fr);font-weight:700}
.tag{font-size:12px;font-weight:800;background:var(--oks);color:var(--ok);border-radius:6px;padding:1px 6px;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nv{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nv button{border:0;background:transparent;min-height:64px;display:grid;place-items:center;gap:2px;font-size:13px;font-weight:800;color:var(--mute);position:relative}
.nv button svg{width:24px;height:24px}
.nv button.on{color:var(--fr)}
#badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--fr);color:#fff;font-size:12px;border-radius:99px;padding:0 6px;line-height:18px}
#sheet{position:fixed;inset:0;background:#1a0e0899;z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.panel{border-radius:24px}}
.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0}
.x{width:44px;height:44px;border:0;background:var(--bg);border-radius:50%;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fld{grid-column:1/-1;display:grid;gap:4px}.fld.half{grid-column:auto}
.fld label{font-size:14px;font-weight:800}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:16px}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin:10px 0 0}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.save{border:0;background:var(--fr);color:#fff;font-weight:900;border-radius:999px;min-height:48px;padding:0 26px}
.del{border:0;background:transparent;color:var(--bad);font-weight:800;min-height:48px;padding:0 10px;margin-right:auto}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--choc);color:var(--cream);padding:10px 18px;border-radius:999px;font-weight:800;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media(max-width:600px){.cmd{grid-template-columns:1fr;gap:4px}.sub{max-width:100%}.hero .hlogo{width:84px;height:84px}.kpis b{font-size:17px}.cat{grid-template-columns:minmax(0,1fr) auto}.cat .bar{grid-column:1/-1;grid-row:2}.hd{gap:10px}.gear{order:2}.mbar{order:3;width:100%;justify-content:space-between}.brand b{font-size:17px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.fld.half{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hd">
  <img class="logo" src="logo.png" alt="Logo MEL Pâtisserie &amp; Snacks" width="52" height="52">
  <div class="brand"><b>Mel Pâtisserie &amp; Snacks</b><span>Gestion de la boutique</span></div>
  <div class="mbar" id="mbar"><button data-mshift="-1" aria-label="Mois précédent">‹</button><b id="mlabel"></b><button data-mshift="1" aria-label="Mois suivant">›</button></div>
  <button class="gear" id="cfgbtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<div id="status"></div>
<main id="view"><p class="empty">Chargement…</p></main>
<nav><div class="nv">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="commandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Commandes<span id="badge" hidden></span></button>
  <button data-tab="achats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1.5 12h-11z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Achats</button>
  <button data-tab="ventes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Ventes</button>
</div></nav>
<div id="sheet" hidden></div>
<div id="dls"></div>
<div id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const dnum=s=>{const p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/864e5};
const diff=s=>s?Math.round(dnum(s)-dnum(today())):0;
const money=n=>Math.round(+n||0).toLocaleString('fr-FR')+' F';
const short=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':a>=1e3?Math.round(n/1e3)+' k':String(Math.round(n))};
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtD=s=>s?new Date(s+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtLong=s=>s?new Date(s+'T00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}):'';
const shiftMonth=(m,k)=>{const p=m.split('-').map(Number);const d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthLabel=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const monthShort=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','');

const ST={attente:'À préparer',prep:'En préparation',prete:'Prête',livree:'Livrée',annulee:'Annulée'};
const NEXT={attente:'prep',prep:'prete',prete:'livree'};
const CATS=['Ingrédients','Emballages & coffrets','Gaz & énergie','Transport & livraison','Matériel','Publicité','Autre'];
const UNITS=['kg','g','L','pièce','sachet','boîte','plateau','carton','lot'];
const PAY=['Espèces','Wave','Orange Money','MTN MoMo','Moov Money','Virement'];
const D={commandes:[],achats:[],ventes:[]};
let mode='local',tab='home',month=today().slice(0,7),cf='avenir',q='',af='date';
const LK='melpat-v1',QK='melpat-queue',CK='melpat-cfg';
const NUM=['total','acompte','rappel','qte','montant','maj','pu'];
let queue=[],cfg={url:'',cle:''},sync={busy:false,err:'',last:0};

const open=c=>c.statut!=='livree'&&c.statut!=='annulee';
const byDate=(a,b)=>((a.date||'')+(a.heure||'')).localeCompare((b.date||'')+(b.heure||''));
const reminders=()=>D.commandes.filter(c=>open(c)&&diff(c.date)<=(+c.rappel||0)).sort(byDate);

/* Stockage : copie sur l'appareil + envoi vers Google Sheets (file d'attente si pas de réseau) */
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'')??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function norm(o){const n={...o};for(const k of NUM)if(k in n&&n[k]!==''&&n[k]!=null&&!isNaN(+n[k]))n[k]=+n[k];return n}
function loadLocal(){const j=rd(LK,{})||{};for(const c in D)D[c]=Array.isArray(j[c])?j[c]:[];queue=rd(QK,[])||[];cfg=rd(CK,cfg)||cfg}
function saveLocal(){wr(LK,D);wr(QK,queue)}
function apply(op){const a=D[op.col];if(!a)return;const i=a.findIndex(x=>x.id===op.id);
  if(op.op==='del'){if(i>=0)a.splice(i,1)}else{const o={...op.obj,id:op.id};if(i<0)a.push(o);else a[i]=o}}
function enqueue(op){queue=queue.filter(x=>!(x.col===op.col&&x.id===op.id));queue.push(op);apply(op);saveLocal();render();flush()}
async function put(col,obj){enqueue({op:'set',col,id:obj.id,obj:{...obj}})}
async function del(col,id){enqueue({op:'del',col,id})}
async function flush(){
  if(!cfg.url||sync.busy||!queue.length)return;
  sync.busy=true;const ops=queue.slice(0,40);
  try{const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({cle:cfg.cle,ops})});const j=await r.json();
    if(!j.ok)throw new Error(j.err==='cle'?'Code secret refusé':'Erreur Google Sheets');
    queue=queue.filter(x=>!ops.includes(x));sync.err='';sync.last=Date.now();saveLocal();
  }catch(e){sync.err=e.message&&e.message.startsWith('Code')?e.message:'Pas de connexion'}
  sync.busy=false;render();if(queue.length&&!sync.err)flush();
}
async function pull(){
  if(!cfg.url||sync.busy)return;
  if(queue.length){await flush();if(queue.length)return}
  sync.busy=true;
  try{const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'cle='+encodeURIComponent(cfg.cle));const j=await r.json();

/* Formulaire d'achat : quantité × prix par unité = montant, et reprise du dernier achat du même article */
function achatForm(nouveau){
  const Q=$('#f_qte'),P=$('#f_pu'),M=$('#f_montant'),A=$('#f_article');
  const h=document.createElement('p');h.className='note fld';h.id='hint';$('#f_montant').closest('.fld').after(h);
  const n=e=>{const x=parseFloat(String(e.value).replace(',','.'));return x>0?x:0};
  const show=()=>{const q=n(Q),p=n(P),m=n(M);h.textContent=q&&p?`${fq(q)} × ${money(p)} = ${money(q*p)}`:q&&m?`Soit ${money(m/q)} par ${$('#f_unite').value}`:'Tape la quantité et le prix par unité : le montant se calcule tout seul.'};
  const calc=()=>{const q=n(Q),p=n(P);if(q&&p)M.value=Math.round(q*p);show()};
  Q.addEventListener('input',calc);P.addEventListener('input',calc);
  M.addEventListener('input',()=>{const q=n(Q),m=n(M);if(q&&m)P.value=Math.round(m/q);show()});
  $('#f_unite').addEventListener('change',show);
  if(nouveau)A.addEventListener('change',()=>{const l=lastAchat(akey(A.value));if(!l)return;
    if(l.cat)$('#f_cat').value=l.cat;if(l.unite)$('#f_unite').value=l.unite;
    const f=$('#f_fournisseur');if(f&&!f.value&&l.fournisseur)f.value=l.fournisseur;
    const lp=+l.pu>0?+l.pu:(+l.qte>0&&+l.montant>0?Math.round(l.montant/l.qte):0);if(!P.value&&lp)P.value=lp;
    if(!Q.value&&+l.qte>0)Q.value=l.qte;calc();
    toast(`Repris du dernier achat (${fmtD(l.date)})`)});
  show();
}

  <div class="calbtns">
  ${jour>now?`<a class="calb g" href="${gcal('Livraison : '+nom,jour,plus(jour,60),c)}" target="_blank" rel="noopener"><b>Le jour de la livraison</b><span>${esc(fmtLong(c.date))}${c.heure?' à '+esc(c.heure):' à 10:00'} · Google Agenda</span></a>`:''}
  ${veille>now?`<a class="calb g" href="${gcal('Préparer : '+nom,veille,plus(veille,30),c)}" target="_blank" rel="noopener"><b>La veille à 18 h, pour préparer</b><span>${esc(fmtLong(shiftDay(c.date,-1)))} à 18:00 · Google Agenda</span></a>`:''}
  ${jour>now?`<button type="button" class="calb" data-ics="${esc(c.id)}"><b>Autre agenda (iPhone, Outlook…)</b><span>Un fichier avec 2 rappels : la veille à 18 h et 2 h avant</span></button>`:'<p class="empty">Cette livraison est déjà passée : pas de rappel à créer.</p>'}
  </div>
  <p class="note">Google Agenda s’ouvre avec tout déjà rempli : touche <b>Enregistrer</b>. Avant d’enregistrer, tu peux toucher « Ajouter une notification » pour choisir quand le téléphone sonne (par exemple 2 heures avant).</p></div>`;
  $('#sheet').hidden=false;document.body.classList.add('lock')}
function shiftDay(d,k){const t=at(d,'12:00');t.setDate(t.getDate()+k);return iso(t)}
function ics(id){const c=D.commandes.find(x=>x.id===id);if(!c)return;
  const e=v=>String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const a=at(c.date,c.heure),v=at(shiftDay(c.date,-1),'18:00'),nom=(c.client||'Client')+' — '+(c.produit||'commande');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mel Patisserie//Gestion//FR','BEGIN:VEVENT','UID:'+c.id+'@mel-patisserie','DTSTAMP:'+zu(new Date()),'DTSTART:'+zu(a),'DTEND:'+zu(plus(a,60)),'SUMMARY:'+e('Livraison : '+nom),'DESCRIPTION:'+e(calInfo(c))];
  if(c.lieu)L.push('LOCATION:'+e(c.lieu));
  if(v>new Date())L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('Préparer : '+nom),'TRIGGER;VALUE=DATE-TIME:'+zu(v),'END:VALARM');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('Livraison dans 2 h : '+nom),'TRIGGER:-PT2H','END:VALARM','END:VEVENT','END:VCALENDAR');
  try{const u=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));const l=document.createElement('a');l.href=u;l.download='commande-'+(c.client||'mel').replace(/[^\w-]+/g,'_')+'.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Fichier agenda téléchargé : ouvre-le')}catch(err){toast('Téléchargement impossible ici')}}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';document.body.classList.remove('lock')}
function openForm(col,id,preset){
  const o=id?D[col].find(x=>x.id===id):null;
  if(col==='ventes'&&o&&o.cmd&&D.commandes.some(c=>c.id===o.cmd))return openForm('commandes',o.cmd);
  const v=o?{...o}:{...DEF[col](),...(preset||{})};
  if(!o&&col!=='commandes'&&month!==today().slice(0,7))v.date=month+'-01';
  if(col==='achats'&&!(+v.pu>0)&&+v.qte>0&&+v.montant>0)v.pu=Math.round(v.montant/v.qte);
  datalists();
  $('#sheet').innerHTML=`<form id="frm" class="panel" novalidate><div class="ph"><h2>${TT[col][o?1:0]}</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div>
  <div class="grid">${F[col].map(f=>field(f,v[f.k])).join('')}</div><p class="err" id="ferr"></p>
  <div class="fa">${o?'<button type="button" class="del" id="del">Supprimer</button>':''}<button class="save">Enregistrer</button></div></form>`;
  $('#sheet').hidden=false;document.body.classList.add('lock');
  if(!o&&!preset)setTimeout(()=>{const f=$('#frm input');f&&f.focus()},60);
  if(preset)setTimeout(()=>{const f=$('#f_qte');f&&f.focus()},60);
  if(col==='achats')achatForm(!o);
  $('#frm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),n=o?{...o}:{id:uid()};
    for(const f of F[col]){let x=String(fd.get(f.k)??'').trim();if(f.t==='number'&&x!=='')x=+x;if(f.req&&x===''){$('#ferr').textContent='À remplir : '+f.l;return}n[f.k]=x}
    n.maj=Date.now();const b=e.target.querySelector('.save');b.disabled=true;
    try{await put(col,n);if(col==='commandes')await syncVente(n);closeSheet();toast('Enregistré')}catch(err){b.disabled=false}};
  if(o)$('#del').onclick=async ev=>{const b=ev.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer la suppression';return}
    try{await del(col,o.id);if(col==='commandes'&&D.ventes.some(x=>x.id==='c_'+o.id))await del('ventes','c_'+o.id);closeSheet();toast('Supprimé')}catch(e){}};
}
async function nextStatus(id){const c=D.commandes.find(x=>x.id===id);if(!c)return;const s=NEXT[c.statut||'attente'];if(!s)return;
  const n={...c,statut:s,maj:Date.now()};try{await put('commandes',n);await syncVente(n);toast(s==='livree'?'Livrée · ajoutée aux ventes':ST[s])}catch(e){}}
async function copyBilan(){const s=stats(month);const t=`Mel Pâtisserie & Snacks — bilan de ${monthLabel(month)}\nVentes : ${money(s.V)} (${s.v.length})\nDépenses : ${money(s.A)} (${s.a.length})\nBénéfice : ${money(s.B)}`;
  try{await navigator.clipboard.writeText(t);toast('Bilan copié')}catch(e){toast('Copie impossible ici')}}

function render(){
  $('#mlabel').textContent=monthLabel(month);$('#mbar').style.visibility=tab==='commandes'?'hidden':'visible';
  const fq=document.activeElement&&document.activeElement.id==='q';
  $('#view').innerHTML=({home,commandes:cmds,achats,ventes})[tab]();
  if(fq&&$('#q')){const i=$('#q');i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}}
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const n=reminders().length,bg=$('#badge');bg.textContent=n;bg.hidden=!n;
  const hh=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  $('#status').innerHTML=!cfg.url?'':sync.err?`${esc(sync.err)}${queue.length?` · ${queue.length} modification${queue.length>1?'s':''} en attente d’envoi`:''} <button data-retry>Réessayer</button>`:queue.length?`Envoi de ${queue.length} modification${queue.length>1?'s':''}…`:sync.last?`Synchronisé avec Google Sheets à ${hh(sync.last)}`:'Synchronisation…';
}

document.addEventListener('click',e=>{const t=e.target;let b;
  if(t.closest('[data-close]')||t.id==='sheet')return closeSheet();
  if(t.closest('a.wa'))return;
  if(b=t.closest('[data-next]')){e.stopPropagation();return nextStatus(b.dataset.next)}
  if(b=t.closest('[data-cal]')){e.stopPropagation();return openCal(b.dataset.cal)}
  if(b=t.closest('[data-tab]')){tab=b.dataset.tab;render();scrollTo(0,0);return}
  if(b=t.closest('[data-mshift]')){month=shiftMonth(month,+b.dataset.mshift);render();return}
  if(b=t.closest('[data-m]')){month=b.dataset.m;render();return}
  if(b=t.closest('[data-cf]')){cf=b.dataset.cf;render();return}
  if(b=t.closest('[data-af]')){af=b.dataset.af;render();return}
  if(b=t.closest('[data-rebuy]')){const l=lastAchat(b.dataset.rebuy);if(l){const p={...l};delete p.id;delete p.date;delete p.maj;return openForm('achats',null,p)}return}
  if(b=t.closest('[data-add]'))return openForm(b.dataset.add);
  if(b=t.closest('[data-edit]'))return openForm(b.dataset.edit,b.dataset.id);
  if(b=t.closest('[data-ics]'))return ics(b.dataset.ics);
  if(t.id==='copy')return copyBilan();
  if(t.closest('#cfgbtn,[data-cfg]'))return openCfg();
  if(t.closest('[data-retry]')){sync.err='';render();return pull()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=cmdList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
setInterval(()=>{if(mode!=='wait'&&$('#sheet').hidden)render()},60000);

loadLocal();render();pull();
setInterval(()=>{if(document.visibilityState==='visible')pull()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
addEventListener('online',()=>{sync.err='';pull()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
